baseURL = "https://rewired.show/"
languageCode = "en-us"
title = "Rewired"
theme = "arcaeon"

[params]
  plausible = "rewired.show"
  author = "Matt Stine & Jaye Anne Beringer"
  description = "A podcast about what happens when people leave rigid belief systems and start finding something alive."
  showName = "Rewired"
  tagline = "We left the systems. We're finding what's alive."
  launchDate = "June 2026"
  # Subscribe CTA target — UTM-tagged so Substack attributes clicks to the standalone site.
  # noreferrer on the buttons strips the Referer header, so these tags are the attribution signal.
  subscribeURL = "https://rewiredshow.substack.com/subscribe?utm_source=rewired.show&utm_medium=website&utm_campaign=subscribe-cta"

[params.colors]
  # ARCÆON palette — Radiant Core subset primary for Rewired (D-11)
  voidPurple = "#1a0f2e"
  deepIndigo = "#0a0f3c"
  fusionGold = "#ffb347"
  ignitionOrange = "#ff7a18"
  plasmaPink = "#ff5fd2"
  ionGlow = "#5be7ff"
  solarWhite = "#fff4e6"
  electricViolet = "#7a2cff"

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "1h"

# Per-episode pages mirror Substack's own slug exactly, flat at the site
# root (03-CONTEXT.md D-04) — e.g. /episode-004-animism-all-the-way-down/,
# not /episodes/episode-004-.../. The /episodes/ list page itself is
# unaffected (that's the section's own _index.md, not a regular page).
[permalinks]
  episodes = "/:slug/"
